<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><title>Antler 重置密码验证码</title></head>
  <body style="font-family:Arial,sans-serif;color:#222;line-height:1.6">
    <p>请在 Antler 找回密码页面输入以下验证码：</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
    <p>验证码 10 分钟内有效，仅可使用一次。请勿向他人透露。</p>
    <p>如果您没有申请重置密码，请忽略此邮件，您的密码不会改变。</p>
  </body>
</html>
